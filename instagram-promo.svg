<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .paper { fill: #fbfbfb; }
      .ink { fill: #0a0a0a; }
      .body { fill: #2a2a2a; }
      .muted { fill: #6b6b6b; }
      .red { fill: #c8102e; }
      .line { stroke: #e7e7e7; stroke-width: 1.5; }
      .line-strong { stroke: #111111; stroke-width: 2; }
      .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 600; letter-spacing: 4px; }
      .display { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: -1px; }
      .text { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
      .text-medium { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
      .mono { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 600; letter-spacing: 2px; }
    </style>
  </defs>

  <rect class="bg" width="1080" height="1080"/>
  <rect class="paper" x="56" y="56" width="968" height="968" rx="2"/>

  <!-- outer frame -->
  <rect x="56" y="56" width="968" height="968" rx="2" fill="none" class="line"/>
  <rect x="86" y="86" width="908" height="908" fill="none" class="line"/>

  <!-- top bar -->
  <line x1="86" y1="210" x2="994" y2="210" class="line"/>
  <line x1="86" y1="842" x2="994" y2="842" class="line"/>

  <!-- left/right film strip rails -->
  <rect x="86" y="210" width="54" height="632" fill="#f6f6f6"/>
  <rect x="940" y="210" width="54" height="632" fill="#f6f6f6"/>
  <line x1="140" y1="210" x2="140" y2="842" class="line"/>
  <line x1="940" y1="210" x2="940" y2="842" class="line"/>
  <g fill="#ffffff" stroke="#e0e0e0" stroke-width="1">
    <!-- left perforations -->
    <rect x="102" y="238" width="22" height="30" rx="5"/>
    <rect x="102" y="288" width="22" height="30" rx="5"/>
    <rect x="102" y="338" width="22" height="30" rx="5"/>
    <rect x="102" y="388" width="22" height="30" rx="5"/>
    <rect x="102" y="438" width="22" height="30" rx="5"/>
    <rect x="102" y="488" width="22" height="30" rx="5"/>
    <rect x="102" y="538" width="22" height="30" rx="5"/>
    <rect x="102" y="588" width="22" height="30" rx="5"/>
    <rect x="102" y="638" width="22" height="30" rx="5"/>
    <rect x="102" y="688" width="22" height="30" rx="5"/>
    <rect x="102" y="738" width="22" height="30" rx="5"/>
    <rect x="102" y="788" width="22" height="30" rx="5"/>
    <!-- right perforations -->
    <rect x="956" y="238" width="22" height="30" rx="5"/>
    <rect x="956" y="288" width="22" height="30" rx="5"/>
    <rect x="956" y="338" width="22" height="30" rx="5"/>
    <rect x="956" y="388" width="22" height="30" rx="5"/>
    <rect x="956" y="438" width="22" height="30" rx="5"/>
    <rect x="956" y="488" width="22" height="30" rx="5"/>
    <rect x="956" y="538" width="22" height="30" rx="5"/>
    <rect x="956" y="588" width="22" height="30" rx="5"/>
    <rect x="956" y="638" width="22" height="30" rx="5"/>
    <rect x="956" y="688" width="22" height="30" rx="5"/>
    <rect x="956" y="738" width="22" height="30" rx="5"/>
    <rect x="956" y="788" width="22" height="30" rx="5"/>
  </g>

  <!-- red cue mark + label -->
  <g transform="translate(170,145)">
    <rect x="-2" y="-22" width="6" height="44" class="red"/>
    <rect x="-22" y="-2" width="44" height="6" class="red"/>
  </g>
  <text x="210" y="153" class="label ink" font-size="24">AC LLC · FILM &amp; SERIES DISTRIBUTION</text>
  <text x="994" y="153" text-anchor="end" class="mono muted" font-size="18">US DISTRIBUTION</text>

  <!-- headline -->
  <text x="170" y="340" class="display ink" font-size="80">Get your film on</text>
  <text x="170" y="432" class="display ink" font-size="80">Tubi, Prime Video, Hulu</text>
  <text x="170" y="524" class="display red" font-size="80">&amp; 50+ platforms.</text>

  <!-- subhead -->
  <text x="170" y="610" class="text body" font-size="34">End-to-end distribution for independent films &amp; series:</text>
  <text x="170" y="656" class="text body" font-size="34">licensing, deliverables, metadata, and royalty reporting.</text>
  <rect x="170" y="694" width="292" height="46" rx="23" fill="#fde8ea"/>
  <text x="316" y="725" text-anchor="middle" class="text-medium red" font-size="24">You keep the rights</text>

  <!-- platform line -->
  <line x1="170" y1="790" x2="910" y2="790" class="line"/>
  <text x="170" y="828" class="mono muted" font-size="20">TUBI  ·  PRIME VIDEO  ·  HULU  ·  APPLE TV  ·  YOUTUBE  ·  PLUTO TV</text>

  <!-- CTA block -->
  <rect x="170" y="882" width="470" height="78" rx="8" class="red"/>
  <text x="405" y="932" text-anchor="middle" class="display" font-size="30" fill="#ffffff">SUBMIT YOUR SCREENER</text>
  <text x="670" y="932" class="display ink" font-size="34">acllc.com</text>
  <text x="170" y="1000" class="text muted" font-size="20">From screener to streaming — get a free distribution review.</text>

  <!-- corner marks -->
  <path d="M86 250 L86 210 L126 210" fill="none" class="line-strong"/>
  <path d="M994 250 L994 210 L954 210" fill="none" class="line-strong"/>
  <path d="M86 802 L86 842 L126 842" fill="none" class="line-strong"/>
  <path d="M994 802 L994 842 L954 842" fill="none" class="line-strong"/>
</svg>
